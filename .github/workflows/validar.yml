name: Validar projeto

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Testar o validador
        run: python3 tools/teste_validar_projeto.py

      - name: Validar integridade do projeto
        run: python3 tools/validar_projeto.py
